name: Run Options Trading Runner

on:
  workflow_dispatch: {}     # allows Cronitor / manual trigger
  schedule:
    - cron: "0 */2 * * *"   # optional: GitHub’s own 2-hour schedule

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run options workflow
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python runner.py

